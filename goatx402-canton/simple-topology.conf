// Localnet Canton topology used by the goat-canton-payment harness.
//
// Differences vs the bundled /canton/simple-topology.conf in the
// digitalasset/canton-open-source image: every Ledger API + Admin API +
// Domain API is bound to 0.0.0.0 instead of 127.0.0.1 so the host can
// reach the participant through the docker port mapping. Without this the
// gRPC handshake closes with "connection reset by peer" the moment a
// client outside the container's network namespace dials in.
//
// All other settings mirror the bundled config (memory storage, the same
// port numbers, the same `enable-testing-commands` feature flag).
canton {
  participants {
    participant1 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port    = 5012
      }
      ledger-api {
        address = "0.0.0.0"
        port    = 5011
      }
    }
    participant2 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port    = 5022
      }
      ledger-api {
        address = "0.0.0.0"
        port    = 5021
      }
    }
  }
  domains {
    mydomain {
      storage.type = memory
      public-api {
        address = "0.0.0.0"
        port    = 5018
      }
      admin-api {
        address = "0.0.0.0"
        port    = 5019
      }
    }
  }
  features.enable-testing-commands = yes
}
